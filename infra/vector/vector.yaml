# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Vector — agent unique pour les logs Docker ET les metriques applicatives.
#
# Pousse vers Scaleway Cockpit :
#   - logs des conteneurs      -> data source `humanix-prod-logs`   (Loki)
#   - requetes HTTP de HAProxy -> data source `humanix-prod-logs`   (Loki,
#                                 label source="haproxy", cf. haproxy_journal)
#   - scrape de /api/metrics   -> data source `humanix-prod-metrics` (Mimir)
#
# ---------------------------------------------------------------------
# CE FICHIER EXISTE PARCE QUE SON ABSENCE A COUTE CHER
# ---------------------------------------------------------------------
#
# Constat du 2026-08-12 : Vector tournait en prod depuis mai et
# n'a JAMAIS rien livre (0 octet, 0 echantillon cote Cockpit), tout en
# crachant 298 Ko/h de logs sur lui-meme — 95 % du volume total de la
# machine. Cinq causes cumulees, chacune suffisante a elle seule :
#
#   1. AUCUNE DESTINATION. Les data sources d'origine `scaleway` sont
#      alimentees par Scaleway et ne se laissent PAS pousser dedans. Il
#      faut des data sources d'origine `custom`. Elles n'existaient pas.
#
#   2. MAUVAISE DATA SOURCE. L'URL pointait sur la data source d'origine
#      `scaleway` (1760729a-...), pas sur une `custom`. Scaleway refuse
#      alors l'ecriture : 403 Forbidden, releve dans les logs Vector du
#      2026-08-12. Ce n'est PAS un 404 : l'URL resolvait et le jeton
#      etait accepte — c'est bien l'autorisation d'ecrire qui manquait.
#      (Piege voisin, distinct : l'URL generique sans identifiant de
#      data source, elle, renvoie 404.)
#
#   3. NOM DE VARIABLE INCOHERENT. Le .env definissait
#      SCW_COCKPIT_TOKEN, la conf lisait SCW_LOKI_TOKEN. Token vide,
#      donc 401. On n'utilise plus qu'UN seul nom, ci-dessous.
#
#      (Ce paragraphe cite les noms SANS la syntaxe dollar-accolade :
#      Vector interpole le fichier en TEXTE BRUT, commentaires compris,
#      avant de parser le YAML. Ecrire la forme complete ici ferait
#      echouer le demarrage sur une variable... qui n'existe plus.)
#
#   4. FICHIER HORS DEPOT. Il ne vivait que sur la machine. Sans son
#      fichier, Vector bascule sur sa source de demo `demo_logs` et
#      fabrique de faux logs syslog. Il est desormais versionne.
#
#   5. AUTO-EXCLUSION INOPERANTE. `exclude_containers` matche par
#      PREFIXE. Le conteneur s'appelle `humanix-prod-vector-1`, le
#      filtre disait `vector` : il ne matchait rien. Vector ingerait
#      donc ses propres erreurs, ce qui en generait de nouvelles — la
#      boucle de retroaction a l'origine des 298 Ko/h.
#
# ---------------------------------------------------------------------
# VARIABLES ATTENDUES (dans le .env de la stack, via `env_file`)
# ---------------------------------------------------------------------
#
#   SCW_COCKPIT_TOKEN     token Cockpit, scopes write_only_logs +
#                         write_only_metrics UNIQUEMENT
#   SCW_LOKI_URL          URL de push COMPLETE de humanix-prod-logs
#   SCW_MIMIR_URL         URL de push COMPLETE de humanix-prod-metrics
#   METRICS_SCRAPE_TOKEN  Bearer attendu par /api/metrics (>= 16 chars)
#
# ATTENTION, LES DEUX URL N'ONT PAS LA MEME FORME. C'est asymetrique et
# ce n'est pas une coquille :
#
#   SCW_LOKI_URL   URL DE BASE, SANS chemin. Le sink `loki` de Vector
#                  ajoute lui-meme `/loki/api/v1/push` ("The base URL of
#                  the Loki instance. The path value is appended to
#                  this"). Fournir le chemin ici le ferait apparaitre en
#                  DOUBLE -> 404.
#
#   SCW_MIMIR_URL  URL COMPLETE, chemin `/api/v1/push` INCLUS. Le sink
#                  `prometheus_remote_write` n'ajoute rien ("The
#                  endpoint should include the scheme and the path to
#                  write to").
#
# Verifie le 2026-08-12 en sondant les endpoints sans jeton (401 = le
# chemin existe, 404 = il n'existe pas) :
#   .../api/v1/push                     -> 401  (metriques : bon chemin)
#   .../api/v1/write                    -> 404
#   .../loki/api/v1/push                -> 401  (logs : bon chemin)
#   .../loki/api/v1/push/loki/api/v1/push -> 404 (le chemin double)

# Vector journalise a son tour ; en `info` il reste discret. Ne pas
# passer en `debug` sans re-verifier l'exclusion ci-dessous, sous peine
# de reproduire la boucle.
log_schema:
  timestamp_key: timestamp

sources:
  # === Logs de tous les conteneurs de la machine ===
  docker:
    type: docker_logs
    # Match par PREFIXE (cf. cause n5). Le nom complet du conteneur est
    # `humanix-prod-vector-1` : le prefixe doit couvrir ce nom, sinon
    # Vector se relit lui-meme en boucle.
    exclude_containers:
      # Match par PREFIXE, et il faut couvrir LES DEUX conventions de nommage.
      #
      # docker compose nomme `humanix-prod-vector-1`, podman-compose nomme
      # `humanix-prod_vector_1` — avec des TIRETS BAS. Constate le 2026-08-13
      # a la bascule de la production : le filtre `humanix-prod-vector` ne
      # correspondait plus, et Vector expediait ses propres journaux.
      #
      # Pas de boucle infinie observee (expedier ne produit pas de journal),
      # mais du bruit, et une amplification des qu'il journalise une erreur.
      - humanix-prod-vector
      - humanix-prod_vector
      - humanix-demo-vector
      - humanix-demo_vector

  # === Logs des conteneurs PODMAN (la demo) ===
  #
  # Le socket Docker ne voit QUE les conteneurs Docker. Depuis la migration
  # de la demo sous Podman rootless (2026-08-13), ses trois conteneurs sont
  # devenus invisibles a la source ci-dessus, et ses logs ont cesse
  # d'atteindre Loki. Personne ne l'a vu : la chaine de PRODUCTION
  # continuait de fonctionner, donc rien n'a alerte.
  #
  # Podman expose une API compatible Docker, mais sur un socket a lui, et
  # desactive par defaut. Cote hote, une fois pour toutes :
  #
  #     systemctl --user enable --now podman.socket
  #
  # `loginctl enable-linger humanix` est deja actif (pose lors de la
  # migration de la demo) : sans lui le socket disparaitrait a la
  # deconnexion, et avec lui les logs.
  #
  # Cette source est TOLERANTE A L'ABSENCE : si le socket n'existe pas,
  # Vector journalise une erreur de connexion et les autres sources
  # continuent. Un poste sans Podman n'est donc pas casse par ce bloc.
  podman:
    type: docker_logs
    docker_host: unix:///var/run/podman.sock
    exclude_containers:
      # Match par PREFIXE, et il faut couvrir LES DEUX conventions de nommage.
      #
      # docker compose nomme `humanix-prod-vector-1`, podman-compose nomme
      # `humanix-prod_vector_1` — avec des TIRETS BAS. Constate le 2026-08-13
      # a la bascule de la production : le filtre `humanix-prod-vector` ne
      # correspondait plus, et Vector expediait ses propres journaux.
      #
      # Pas de boucle infinie observee (expedier ne produit pas de journal),
      # mais du bruit, et une amplification des qu'il journalise une erreur.
      - humanix-prod-vector
      - humanix-prod_vector
      - humanix-demo-vector
      - humanix-demo_vector

  # === Metriques applicatives ===
  #
  # Cockpit ne sait pas scraper un endpoint externe : il ne fait que
  # RECEVOIR du push. C'est donc Vector qui scrape puis pousse.
  humanix_metrics:
    type: prometheus_scrape
    # `app:3000` = le NOM DE SERVICE compose, pas le nom du conteneur. C'est
    # la convention deja eprouvee par ofelia (APP_INTERNAL_URL). Elle survit
    # aux renommages de conteneur, contrairement a `humanix-prod-app`.
    endpoints:
      - "http://${HUMANIX_METRICS_TARGET:-app:3000}/api/metrics"
    # 60 s et pas 30 : la facturation Cockpit est lineaire en nombre
    # d'echantillons. Passer a 30 s double la note pour un gain de
    # resolution dont on n'a pas l'usage ici.
    scrape_interval_secs: 60
    auth:
      strategy: bearer
      token: "${METRICS_SCRAPE_TOKEN}"

  # === Journal HAProxy : requetes HTTP de TOUT le trafic ===
  #
  # Pourquoi passer par HAProxy plutot que par l'application : il n'existe
  # aucun point de passage unique cote Node. `proxy.ts` tourne en runtime
  # EDGE, ou prom-client ne peut pas vivre, et instrumenter route par route
  # ne couvrirait que les routes instrumentees. HAProxy, lui, voit TOUT :
  # pages, API, fichiers statiques, et les erreurs qui n'atteignent jamais
  # l'application.
  #
  # Le fichier est en syslog:adm 640. Le conteneur doit donc appartenir au
  # groupe `adm` (gid 4) : cf. `group_add` dans docker-compose.observabilite.yml.
  haproxy:
    type: file
    include:
      - /var/log/haproxy.log
    # `end` : on ne rejoue pas l'historique au demarrage. Sans ca, chaque
    # redemarrage de Vector reinjecterait tout le fichier et fausserait les
    # compteurs.
    read_from: end

  # === Journaux de la crontab de l'hote ===
  #
  # Sauvegardes, archivage, crons applicatifs, acme.sh : les scripts ecrivent
  # dans /var/log/humanix/*.log (cf. infra/cron/crontab.prod), monte en
  # lecture seule dans le conteneur. Jusqu'au 2026-10-03 rien n'en sortait :
  # 1 468 echecs de crons en six semaines, et personne ne les a vus.
  exploitation_journaux:
    type: file
    include:
      - /var/log/humanix/backup.log
      - /var/log/humanix/archive.log
      - /var/log/humanix/cron.log
      - /var/log/humanix/acme.log
    read_from: end

  # === Mesures de l'hote et des conteneurs (scripts/host-stats.py) ===
  #
  # Une ligne JSON par mesure, chaque minute, depuis la crontab de l'hote.
  # Converties en jauges plus bas : ~40 series, ~0,30 EUR/mois.
  hote_stats:
    type: file
    include:
      - /var/log/humanix/stats.log
    read_from: end

transforms:
  # Les logs applicatifs sont deja du JSON : on l'aplatit pour pouvoir
  # requeter les champs dans Loki plutot qu'une chaine opaque.
  parse_json:
    type: remap
    inputs:
      - docker
      - podman
    source: |
      # On ne fusionne QUE si le parse donne un objet : `merge` exige un
      # object strict et echouerait sur un scalaire (ex. un log "ok").
      #
      # `merge` SANS `!` : `object!(parsed)` garantit deja le type, donc
      # merge ne peut plus echouer. Le `!` faisait emettre a VRL un
      # avertissement au demarrage ("this function can't fail, remove
      # this abort instruction") — du bruit dans les logs, au milieu
      # duquel une vraie erreur passerait inapercue.
      if exists(.message) && is_string(.message) {
        parsed, err = parse_json(.message)
        if err == null && is_object(parsed) {
          . = merge(., object!(parsed))
        }
      }

      # Prod et demo cohabitent sur la meme machine et partagent ce
      # Vector. On derive l'environnement du nom du conteneur, sans quoi
      # les deux flux seraient indiscernables dans Loki.
      #
      # `string(...) ?? ""` et non `string!(...)` : la forme avec `!`
      # ABANDONNE l'evenement si le champ est absent, et un evenement
      # abandonne par un `remap` est jete SILENCIEUSEMENT. Verifie : sur
      # un evenement sans container_name, la forme `!` perd la ligne,
      # celle-ci la conserve avec env="inconnu".
      nom = string(.container_name) ?? ""
      .env = "inconnu"
      if starts_with(nom, "humanix-prod-") {
        .env = "prod"
      } else if starts_with(nom, "humanix-demo-") {
        .env = "demo"
      }

  # Extraction du statut et de la duree depuis le format `option httplog`.
  #
  # Format :
  #   <ts> <host> haproxy[<pid>]: <ip>:<port> [<date>] <front>~ <back>/<srv>
  #   <Tq>/<Tw>/<Tc>/<Tr>/<Tt> <status> <octets> - - <flags> ... "<methode> <chemin> <proto>"
  #
  # Cette branche ne garde QUE le statut et la duree totale : elle alimente
  # les METRIQUES (Mimir). Les lignes completes, adresse IP comprise, partent
  # vers Loki par `haproxy_journal` ci-dessous, avec leur justification.
  haproxy_extraction:
    type: remap
    inputs:
      - haproxy
    drop_on_error: true
    drop_on_abort: true
    source: |
      champs, err = parse_regex(.message, r'/(?P<tt>-?\d+)\s(?P<statut>\d{3})\s\d+\s')
      if err != null {
        # Lignes sans requete HTTP (echecs de handshake TLS, messages de
        # demarrage). On les abandonne : `drop_on_abort` les ecarte sans
        # remplir le journal d'erreurs.
        abort
      }
      .statut = champs.statut
      # HAProxy exprime les durees en MILLISECONDES, Prometheus attend des
      # SECONDES. Une requete en cours vaut -1 : on la ramene a 0.
      ms = to_int(champs.tt) ?? 0
      if ms < 0 { ms = 0 }
      .duree_secondes = to_float(ms) / 1000.0
      # On ne derive PAS de "classe de statut" (2xx, 5xx...). Le tableau de
      # bord filtre deja avec `status=~"5.."` sur le statut brut, et les codes
      # HTTP forment un ensemble naturellement borne : une vingtaine de
      # valeurs, pas de risque d'explosion de cardinalite.

  # === Journal HAProxy -> Loki : voir les attaques ===
  #
  # Jusqu'au 2026-10-03, HAProxy n'alimentait que des metriques (statut,
  # duree). Impossible de repondre a « qui nous scanne ? », « quelle IP
  # martele /api/auth ? », « que cherchaient les 6 000 lignes en 404
  # d'hier ? ». Cette branche envoie chaque requete a Loki, structuree.
  #
  # RGPD, decision explicite du 2026-10-03 : finalite = securite du
  # traitement (art. 32). Donnees envoyees : adresse IP, methode, chemin
  # SANS parametres, statut, octets, duree, etat de terminaison. Retention
  # Cockpit : 7 jours (defaut des sources custom, cf. infra/grafana/
  # README.md). Pas d'agent utilisateur ni d'en-tete : HAProxy ne les
  # journalise pas. Les parametres de requete sont retires AVANT envoi :
  # /api/auth/callback?code=... ou ?email=... ne quittent jamais la
  # machine. La politique de confidentialite cite deja « adresse IP, user
  # agent (logs serveur) » parmi les donnees traitees.
  #
  # Volume mesure le 2026-10-03 : ~13 000 lignes/jour, ~5 Mo/jour en JSON,
  # soit ~0,05 EUR/mois a 0,35 EUR/Go. Labels Loki (faible cardinalite) :
  # source, env, type, classe. L'IP et le chemin restent dans le corps,
  # requetables via `| json`.
  haproxy_journal:
    type: remap
    inputs:
      - haproxy
    drop_on_error: true
    drop_on_abort: true
    source: |
      # 1. Prefixe rsyslog : "<iso> <hote> haproxy[<pid>]: <ligne haproxy>"
      corps, err = parse_regex(.message, r'^\S+\s+\S+\s+haproxy\[\d+\]:\s+(?P<ligne>.*)$')
      if err != null {
        abort
      }
      ligne = string!(corps.ligne)

      # 2. Requete HTTP (format `option httplog`). Les captures d'en-tetes
      #    entre accolades sont optionnelles : absentes aujourd'hui,
      #    tolerees si on en ajoute un jour dans haproxy.cfg.
      http, err = parse_regex(ligne, r'^(?P<client_ip>[0-9a-fA-F.:]+):(?P<client_port>\d+)\s\[(?P<date>[^\]]+)\]\s(?P<frontend>[^\s~]+)(?P<tls>~)?\s(?P<backend>[^/\s]+)/(?P<serveur>\S+)\s(?P<tq>-?\d+)/(?P<tw>-?\d+)/(?P<tc>-?\d+)/(?P<tr>-?\d+)/(?P<tt>-?\d+)\s(?P<statut>\d{3})\s(?P<octets>\d+)\s\S+\s\S+\s(?P<terminaison>\S{4})\s\d+/\d+/\d+/\d+/\d+\s\d+/\d+(?:\s\{(?P<entetes_req>[^}]*)\})?(?:\s\{(?P<entetes_rep>[^}]*)\})?\s"(?P<requete>[^"]*)"$')
      if err == null {
        .type = "http"
        .client_ip = http.client_ip
        .frontend = http.frontend
        .tls = (string(http.tls) ?? "") == "~"
        .backend = http.backend
        .serveur = http.serveur
        .statut = to_int(http.statut) ?? 0
        .octets = to_int(http.octets) ?? 0
        ms = to_int(http.tt) ?? 0
        if ms < 0 { ms = 0 }
        .duree_ms = ms
        .terminaison = http.terminaison
        .date_haproxy = http.date
        entetes = string(http.entetes_req) ?? ""
        if entetes != "" { .entetes_requete = entetes }

        # Methode, chemin, protocole. "<BADREQ>" = requete illisible.
        requete = string!(http.requete)
        req, err = parse_regex(requete, r'^(?P<methode>[A-Z]+)\s(?P<cible>\S+)(?:\s(?P<proto>\S+))?$')
        if err == null {
          .methode = req.methode
          .proto = req.proto
          cible = string!(req.cible)
          # Parametres de requete retires : jamais envoyes hors machine.
          morceaux = split(cible, "?", 2)
          .chemin = morceaux[0]
          .parametres = length(morceaux) > 1
        } else {
          .methode = "BADREQ"
          .chemin = ""
          .parametres = false
        }

        # Classe de statut : label Loki a six valeurs au plus.
        if .statut >= 500 {
          .classe = "5xx"
        } else if .statut >= 400 {
          .classe = "4xx"
        } else if .statut >= 300 {
          .classe = "3xx"
        } else if .statut >= 200 {
          .classe = "2xx"
        } else {
          .classe = "1xx"
        }
      } else {
        # 3. Lignes sans requete, ex. "<ip>:<port> [<date>] https_front/1:
        #    SSL handshake failure". Un pic = balayage de la machine.
        autre, err = parse_regex(ligne, r'^(?P<client_ip>[0-9a-fA-F.:]+):(?P<client_port>\d+)\s\[(?P<date>[^\]]+)\]\s(?P<frontend>[^/\s:]+)(?:/\S+)?:\s(?P<erreur>.*)$')
        if err != null {
          # Messages de service (demarrage, rechargement, serveur UP ou
          # DOWN) : ils restent dans les journaux de l'hote.
          abort
        }
        .type = "connexion"
        .client_ip = autre.client_ip
        .frontend = autre.frontend
        .erreur = autre.erreur
        .classe = "0xx"
        .date_haproxy = autre.date
      }

      # Environnement d'apres le backend : ce Vector est partage prod/demo.
      # "edge" = HAProxy a repondu seul (redirection, refus, requete illisible).
      .env = "edge"
      backend = string(.backend) ?? ""
      if backend == "backend_prod" {
        .env = "prod"
      } else if backend == "backend_demo" {
        .env = "demo"
      }

      # Ligne compacte pour l'oeil ; le detail est dans les champs.
      if .type == "http" {
        .message = join!([string!(.methode), string!(.chemin), to_string(.statut) ?? "", "depuis", string!(.client_ip)], " ")
      } else {
        .message = join!([string!(.erreur), "depuis", string!(.client_ip)], " ")
      }
      del(.file)
      del(.source_type)
      # `host` ici = nom d'hote du conteneur Vector (un identifiant), pas la
      # machine : le label host du sink dit deja humanix-prod-01.
      del(.host)

  # === Journaux d'exploitation -> Loki ===
  #
  # Chaque ligne recoit son fichier d'origine, un resultat a trois valeurs
  # (ok / echec / info, label Loki) et, pour les crons, le job et le code.
  exploitation_lignes:
    type: remap
    inputs:
      - exploitation_journaux
    source: |
      .fichier = replace(string!(.file), r'^.*/', "")
      msg = string!(.message)
      .resultat = "info"
      if match(msg, r'\] OK \d+ ') || contains(msg, "avec succes") || contains(msg, "Cert success") {
        .resultat = "ok"
      }
      if contains(msg, "ECHEC") || contains(msg, "FATAL") || match(msg, r'(?i)\berror\b') {
        .resultat = "echec"
      }
      # Le job : sur la ligne POST (/api/cron/<slug>) comme sur la ligne de
      # resultat (job=<slug>, cf. scripts/cron-runner.sh).
      job, err = parse_regex(msg, r'(?:job=|/api/cron/)(?P<job>[a-z0-9-]+)')
      if err == null {
        .job = job.job
      }
      code, err = parse_regex(msg, r'\] (?:OK|ECHEC) (?P<code>\d+) ')
      if err == null {
        .code = code.code
      }
      del(.file)
      del(.source_type)
      # `host` ici = nom d'hote du conteneur Vector (un identifiant), pas la
      # machine : le label host du sink dit deja humanix-prod-01.
      del(.host)

  # === Mesures de l'hote : JSON -> champs, puis aiguillage par type ===
  hote_stats_json:
    type: remap
    inputs:
      - hote_stats
    drop_on_error: true
    drop_on_abort: true
    source: |
      msg = string!(.message)
      del(.message)
      parsed, err = parse_json(msg)
      if err != null || !is_object(parsed) {
        abort
      }
      . = merge(., object!(parsed))
      del(.file)
      del(.source_type)
      # `host` ici = nom d'hote du conteneur Vector (un identifiant), pas la
      # machine : le label host du sink dit deja humanix-prod-01.
      del(.host)

  hote_stats_route:
    type: route
    inputs:
      - hote_stats_json
    route:
      hote: '.type == "hote"'
      disque: '.type == "disque"'
      conteneur: '.type == "conteneur"'
      certificat: '.type == "certificat"'
      base: '.type == "base"'
      erreur: '.type == "erreur"'

  # Jauges Prometheus. Noms attendus par
  # infra/grafana/dashboards/humanix-exploitation.json et les regles 12 a 16
  # de docs/ALERTES-GRAFANA.md.
  metriques_hote:
    type: log_to_metric
    inputs:
      - hote_stats_route.hote
    metrics:
      - type: gauge
        field: cpu_pct
        name: hote_cpu_pourcent
        namespace: humanix
      - type: gauge
        field: charge_1m
        name: hote_charge_1m
        namespace: humanix
      - type: gauge
        field: charge_5m
        name: hote_charge_5m
        namespace: humanix
      - type: gauge
        field: charge_15m
        name: hote_charge_15m
        namespace: humanix
      - type: gauge
        field: mem_total
        name: hote_memoire_totale_octets
        namespace: humanix
      - type: gauge
        field: mem_utilisee
        name: hote_memoire_utilisee_octets
        namespace: humanix
      - type: gauge
        field: mem_disponible
        name: hote_memoire_disponible_octets
        namespace: humanix
      - type: gauge
        field: swap_total
        name: hote_swap_total_octets
        namespace: humanix
      - type: gauge
        field: swap_utilise
        name: hote_swap_utilise_octets
        namespace: humanix
      - type: gauge
        field: uptime_s
        name: hote_uptime_secondes
        namespace: humanix

  metriques_disques:
    type: log_to_metric
    inputs:
      - hote_stats_route.disque
    metrics:
      - type: gauge
        field: total
        name: hote_disque_total_octets
        namespace: humanix
        tags:
          point: "{{point}}"
      - type: gauge
        field: utilise
        name: hote_disque_utilise_octets
        namespace: humanix
        tags:
          point: "{{point}}"

  metriques_conteneurs:
    type: log_to_metric
    inputs:
      - hote_stats_route.conteneur
    metrics:
      - type: gauge
        field: cpu_pct
        name: conteneur_cpu_pourcent
        namespace: humanix
        tags:
          conteneur: "{{nom}}"
      - type: gauge
        field: mem
        name: conteneur_memoire_octets
        namespace: humanix
        tags:
          conteneur: "{{nom}}"
      - type: gauge
        field: pids
        name: conteneur_pids
        namespace: humanix
        tags:
          conteneur: "{{nom}}"

  metriques_certificats:
    type: log_to_metric
    inputs:
      - hote_stats_route.certificat
    metrics:
      - type: gauge
        field: jours
        name: certificat_jours_restants
        namespace: humanix
        tags:
          domaine: "{{domaine}}"

  metriques_bases:
    type: log_to_metric
    inputs:
      - hote_stats_route.base
    metrics:
      - type: gauge
        field: taille
        name: base_taille_octets
        namespace: humanix
        tags:
          conteneur: "{{conteneur}}"
      - type: gauge
        field: connexions
        name: base_connexions
        namespace: humanix
        tags:
          conteneur: "{{conteneur}}"
      - type: gauge
        field: max_connexions
        name: base_connexions_max
        namespace: humanix
        tags:
          conteneur: "{{conteneur}}"
      - type: gauge
        field: cache_pct
        name: base_cache_pourcent
        namespace: humanix
        tags:
          conteneur: "{{conteneur}}"
      - type: gauge
        field: tuples_morts
        name: base_tuples_morts
        namespace: humanix
        tags:
          conteneur: "{{conteneur}}"
      - type: gauge
        field: transaction_max_s
        name: base_transaction_max_secondes
        namespace: humanix
        tags:
          conteneur: "{{conteneur}}"

  # Les erreurs du script partent dans Loki avec les journaux d'exploitation.
  hote_stats_erreurs:
    type: remap
    inputs:
      - hote_stats_route.erreur
    source: |
      .fichier = "stats.log"
      .resultat = "echec"
      .message = join!([string!(.section), string!(.message)], " : ")

  # Conversion en metriques Prometheus. Les noms sont ceux qu'attendent
  # infra/grafana/dashboards/humanix-overview.json et alerts-cockpit.md.
  haproxy_metriques:
    type: log_to_metric
    inputs:
      - haproxy_extraction
    metrics:
      - type: counter
        field: statut
        name: http_requests_total
        namespace: humanix
        tags:
          status: "{{statut}}"
      - type: histogram
        field: duree_secondes
        name: http_request_duration_seconds
        namespace: humanix
        tags:
          status: "{{statut}}"

sinks:
  scaleway_loki:
    type: loki
    inputs:
      - parse_json
    endpoint: "${SCW_LOKI_URL}"
    auth:
      strategy: bearer
      token: "${SCW_COCKPIT_TOKEN}"
    encoding:
      codec: json
    # Retire du corps les champs promus en labels, pour ne pas stocker
    # deux fois la meme information (on paie l'octet ingere).
    remove_label_fields: true
    # Labels Loki : uniquement des valeurs a faible cardinalite. Ne
    # JAMAIS y mettre d'identifiant d'utilisateur, de requete ou de
    # session : chaque valeur distincte cree un flux, et la facture
    # comme les performances suivent. Aucune donnee personnelle ici.
    labels:
      host: humanix-prod-01
      container: "{{ container_name }}"
      image: "{{ image }}"
      env: "{{ env }}"

  # Journal HAProxy : meme data source Loki, labels differents, d'ou un
  # second sink. Jamais d'IP ni de chemin en label : chaque valeur distincte
  # creerait un flux. Ils sont dans le corps JSON.
  scaleway_loki_haproxy:
    type: loki
    inputs:
      - haproxy_journal
    endpoint: "${SCW_LOKI_URL}"
    auth:
      strategy: bearer
      token: "${SCW_COCKPIT_TOKEN}"
    encoding:
      codec: json
    remove_label_fields: true
    labels:
      host: humanix-prod-01
      source: haproxy
      env: "{{ env }}"
      type: "{{ type }}"
      classe: "{{ classe }}"

  # Journaux d'exploitation : meme data source Loki, labels fichier/resultat.
  scaleway_loki_exploitation:
    type: loki
    inputs:
      - exploitation_lignes
      - hote_stats_erreurs
    endpoint: "${SCW_LOKI_URL}"
    auth:
      strategy: bearer
      token: "${SCW_COCKPIT_TOKEN}"
    encoding:
      codec: json
    remove_label_fields: true
    labels:
      host: humanix-prod-01
      source: exploitation
      fichier: "{{ fichier }}"
      resultat: "{{ resultat }}"

  scaleway_mimir:
    type: prometheus_remote_write
    inputs:
      - humanix_metrics
      - haproxy_metriques
      - metriques_hote
      - metriques_disques
      - metriques_conteneurs
      - metriques_certificats
      - metriques_bases
    endpoint: "${SCW_MIMIR_URL}"
    # Bornes de l'histogramme des durees. Vector agrege les distributions en
    # histogrammes Prometheus a l'aide de ces bornes ; sans elles il prendrait
    # ses valeurs par defaut, et les seuils du tableau de bord (p50/p95/p99)
    # tomberaient a cote.
    #
    # Valeurs alignees sur celles de lib/metrics/registry.ts, pour que les
    # metriques venant de l'application et celles venant de HAProxy soient
    # comparables. De 50 ms (page en cache) a 10 s (generation de PDF ou d'IA).
    buckets: [0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0]
    auth:
      strategy: bearer
      token: "${SCW_COCKPIT_TOKEN}"
    # Healthcheck DESACTIVE, et ce n'est pas de la complaisance : il ne
    # peut structurellement pas reussir. Vector teste l'endpoint en GET,
    # or l'endpoint de push Cockpit n'accepte que POST. Mesure le
    # 2026-08-12 sur l'URL reelle :
    #
    #   GET  -> 404 Not Found
    #   POST -> 401 Unauthorized (donc le chemin est bon)
    #
    # Le laisser actif fait ecrire un "Healthcheck failed ... 404" en
    # ERROR a CHAQUE demarrage. Une erreur permanente qui n'en est pas
    # une, c'est ce qui apprend a ne plus lire les erreurs — precisement
    # ce qui a permis a cette panne de durer trois mois.
    #
    # La livraison reelle, elle, reste verifiable : compteurs
    # d'ingestion Cockpit, et absence de "events dropped" dans ces logs.
    healthcheck:
      enabled: false

# ---------------------------------------------------------------------
# TESTS UNITAIRES : `vector test infra/vector/vector.yaml`
# ---------------------------------------------------------------------
# Lignes reelles du 2026-10-03 (adresses conservees telles quelles : ce sont
# des scanners, et c'est precisement ce qu'on veut savoir reconnaitre).
tests:
  - name: haproxy_journal, requete HTTPS servie par la prod
    inputs:
      - insert_at: haproxy_journal
        type: log
        log_fields:
          message: '2026-10-03T00:18:40.895560+02:00 humanix-prod-01 haproxy[838232]: 217.113.194.238:3809 [03/Oct/2026:00:18:40.891] https_front~ backend_prod/prod_a 0/0/0/3/3 200 1663 - - ---- 1/1/0/0/0 0/0 "GET /robots.txt HTTP/1.1"'
    outputs:
      - extract_from: haproxy_journal
        conditions:
          - type: vrl
            source: |
              assert_eq!(.type, "http")
              assert_eq!(.client_ip, "217.113.194.238")
              assert_eq!(.env, "prod")
              assert_eq!(.tls, true)
              assert_eq!(.frontend, "https_front")
              assert_eq!(.backend, "backend_prod")
              assert_eq!(.methode, "GET")
              assert_eq!(.chemin, "/robots.txt")
              assert_eq!(.parametres, false)
              assert_eq!(.statut, 200)
              assert_eq!(.classe, "2xx")
              assert_eq!(.octets, 1663)
              assert_eq!(.duree_ms, 3)
              assert_eq!(.terminaison, "----")
              assert_eq!(.message, "GET /robots.txt 200 depuis 217.113.194.238")

  - name: haproxy_journal, sonde de scanner sur la demo, parametres retires
    inputs:
      - insert_at: haproxy_journal
        type: log
        log_fields:
          message: '2026-10-03T01:02:03.000000+02:00 humanix-prod-01 haproxy[838232]: 80.94.95.211:50123 [03/Oct/2026:01:02:03.000] https_front~ backend_demo/demo_b 0/0/1/12/13 404 2048 - - ---- 3/3/1/1/0 0/0 "GET /.env?email=a@b.fr&code=secret HTTP/1.1"'
    outputs:
      - extract_from: haproxy_journal
        conditions:
          - type: vrl
            source: |
              assert_eq!(.env, "demo")
              assert_eq!(.chemin, "/.env")
              assert_eq!(.parametres, true)
              assert!(!contains(encode_json(.), "secret"))
              assert!(!contains(encode_json(.), "a@b.fr"))
              assert_eq!(.statut, 404)
              assert_eq!(.classe, "4xx")
              assert_eq!(.duree_ms, 13)

  - name: haproxy_journal, requete illisible refusee par HAProxy seul
    inputs:
      - insert_at: haproxy_journal
        type: log
        log_fields:
          message: '2026-10-03T00:16:58.823076+02:00 humanix-prod-01 haproxy[838232]: 45.82.78.108:49086 [03/Oct/2026:00:16:58.822] http_front http_front/<NOSRV> -1/-1/-1/-1/0 400 0 - - PR-- 1/1/0/0/0 0/0 "<BADREQ>"'
    outputs:
      - extract_from: haproxy_journal
        conditions:
          - type: vrl
            source: |
              assert_eq!(.type, "http")
              assert_eq!(.env, "edge")
              assert_eq!(.tls, false)
              assert_eq!(.methode, "BADREQ")
              assert_eq!(.chemin, "")
              assert_eq!(.statut, 400)
              assert_eq!(.terminaison, "PR--")
              assert_eq!(.duree_ms, 0)

  - name: haproxy_journal, echec de poignee de main TLS
    inputs:
      - insert_at: haproxy_journal
        type: log
        log_fields:
          message: "2026-10-03T00:24:18.777013+02:00 humanix-prod-01 haproxy[838232]: 94.231.206.206:55241 [03/Oct/2026:00:24:18.459] https_front/1: SSL handshake failure"
    outputs:
      - extract_from: haproxy_journal
        conditions:
          - type: vrl
            source: |
              assert_eq!(.type, "connexion")
              assert_eq!(.client_ip, "94.231.206.206")
              assert_eq!(.frontend, "https_front")
              assert_eq!(.erreur, "SSL handshake failure")
              assert_eq!(.classe, "0xx")
              assert_eq!(.env, "edge")
              assert_eq!(.message, "SSL handshake failure depuis 94.231.206.206")

  - name: haproxy_journal, message de service ignore
    inputs:
      - insert_at: haproxy_journal
        type: log
        log_fields:
          message: "2026-10-03T00:00:01.000000+02:00 humanix-prod-01 haproxy[838232]: Server backend_prod/prod_a is UP, reason: Layer7 check passed"
    no_outputs_from:
      - haproxy_journal

  - name: haproxy_extraction, les metriques restent alimentees
    inputs:
      - insert_at: haproxy_extraction
        type: log
        log_fields:
          message: '2026-10-03T00:18:40.895560+02:00 humanix-prod-01 haproxy[838232]: 217.113.194.238:3809 [03/Oct/2026:00:18:40.891] https_front~ backend_prod/prod_a 0/0/0/3/3 200 1663 - - ---- 1/1/0/0/0 0/0 "GET /robots.txt HTTP/1.1"'
    outputs:
      - extract_from: haproxy_extraction
        conditions:
          - type: vrl
            source: |
              assert_eq!(.statut, "200")
              assert_eq!(.duree_secondes, 0.003)

  - name: exploitation_lignes, cron reussi avec son job
    inputs:
      - insert_at: exploitation_lignes
        type: log
        log_fields:
          file: /var/log/humanix/cron.log
          message: '[cron-runner] OK 200 en 0s job=phishing-drip : {"ok":true,"picked":0,"sent":0,"failed":0,"errors":[]}'
    outputs:
      - extract_from: exploitation_lignes
        conditions:
          - type: vrl
            source: |
              assert_eq!(.fichier, "cron.log")
              assert_eq!(.resultat, "ok")
              assert_eq!(.job, "phishing-drip")
              assert_eq!(.code, "200")

  - name: exploitation_lignes, cron en echec
    inputs:
      - insert_at: exploitation_lignes
        type: log
        log_fields:
          file: /var/log/humanix/cron.log
          message: "[cron-runner] ECHEC 000000 apres 10s job=phishing-launch : "
    outputs:
      - extract_from: exploitation_lignes
        conditions:
          - type: vrl
            source: |
              assert_eq!(.resultat, "echec")
              assert_eq!(.job, "phishing-launch")
              assert_eq!(.code, "000000")

  - name: exploitation_lignes, ligne POST d'avant le correctif, job lu dans l'URL
    inputs:
      - insert_at: exploitation_lignes
        type: log
        log_fields:
          file: /var/log/humanix/cron.log
          message: "[cron-runner] 2026-10-03T09:00:01Z POST http://127.0.0.1:3000/api/cron/breaches-refresh"
    outputs:
      - extract_from: exploitation_lignes
        conditions:
          - type: vrl
            source: |
              assert_eq!(.resultat, "info")
              assert_eq!(.job, "breaches-refresh")

  - name: exploitation_lignes, sauvegarde reussie
    inputs:
      - insert_at: exploitation_lignes
        type: log
        log_fields:
          file: /var/log/humanix/backup.log
          message: "[2026-10-03T00:49:03Z] Sauvegarde terminee avec succes."
    outputs:
      - extract_from: exploitation_lignes
        conditions:
          - type: vrl
            source: |
              assert_eq!(.fichier, "backup.log")
              assert_eq!(.resultat, "ok")

  - name: exploitation_lignes, sauvegarde en echec
    inputs:
      - insert_at: exploitation_lignes
        type: log
        log_fields:
          file: /var/log/humanix/backup.log
          message: "[2026-10-03T00:49:03Z] FATAL: pg_dump a echoue"
    outputs:
      - extract_from: exploitation_lignes
        conditions:
          - type: vrl
            source: |
              assert_eq!(.resultat, "echec")

  - name: exploitation_lignes, archivage sans objet reste une information
    inputs:
      - insert_at: exploitation_lignes
        type: log
        log_fields:
          file: /var/log/humanix/archive.log
          message: "[2026-10-02T23:00:01Z] Aucun mois complet au-dela du seuil. Rien a archiver."
    outputs:
      - extract_from: exploitation_lignes
        conditions:
          - type: vrl
            source: |
              assert_eq!(.fichier, "archive.log")
              assert_eq!(.resultat, "info")

  - name: hote_stats, mesure disque -> deux jauges etiquetees par point de montage
    inputs:
      - insert_at: hote_stats_json
        type: log
        log_fields:
          file: /var/log/humanix/stats.log
          message: '{"ts":"2026-10-03T10:00:00Z","type":"disque","point":"/var/log","total":20935426048,"utilise":14250123264}'
    outputs:
      - extract_from: metriques_disques
        conditions:
          - type: vrl
            source: |
              # Dans une condition VRL, un evenement metrique n'expose que
              # kind, name, namespace, tags, timestamp et type : pas sa valeur.
              assert_eq!(.type, "gauge")
              assert_eq!(.kind, "absolute")
              assert_eq!(.namespace, "humanix")
              assert!(starts_with(string!(.name), "hote_disque_"))
              assert_eq!(.tags.point, "/var/log")

  - name: hote_stats, certificat -> jours restants par domaine
    inputs:
      - insert_at: hote_stats_json
        type: log
        log_fields:
          file: /var/log/humanix/stats.log
          message: '{"ts":"2026-10-03T10:00:00Z","type":"certificat","domaine":"humanix-academie.fr","jours":71}'
    outputs:
      - extract_from: metriques_certificats
        conditions:
          - type: vrl
            source: |
              assert_eq!(.type, "gauge")
              assert_eq!(.name, "certificat_jours_restants")
              assert_eq!(.tags.domaine, "humanix-academie.fr")

  - name: hote_stats, conteneur -> jauges etiquetees par nom
    inputs:
      - insert_at: hote_stats_json
        type: log
        log_fields:
          file: /var/log/humanix/stats.log
          message: '{"ts":"2026-10-03T10:00:00Z","type":"conteneur","nom":"humanix-prod-app","cpu_pct":1.5,"mem":113553408,"pids":23}'
    outputs:
      - extract_from: metriques_conteneurs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.namespace, "humanix")
              assert!(starts_with(string!(.name), "conteneur_"))
              assert_eq!(.tags.conteneur, "humanix-prod-app")

  - name: hote_stats, erreur du script -> journal d'exploitation en echec
    inputs:
      - insert_at: hote_stats_json
        type: log
        log_fields:
          file: /var/log/humanix/stats.log
          message: '{"ts":"2026-10-03T10:00:00Z","type":"erreur","section":"certificat demo.humanix-academie.fr","message":"SSLCertVerificationError: certificate has expired"}'
    outputs:
      - extract_from: hote_stats_erreurs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.fichier, "stats.log")
              assert_eq!(.resultat, "echec")
              assert!(contains(string!(.message), "certificat demo.humanix-academie.fr : SSLCertVerificationError"))

  - name: hote_stats, ligne non JSON ignoree
    inputs:
      - insert_at: hote_stats_json
        type: log
        log_fields:
          file: /var/log/humanix/stats.log
          message: "Traceback (most recent call last):"
    no_outputs_from:
      - hote_stats_json

  - name: hote_stats, base PostgreSQL -> six jauges etiquetees par conteneur
    inputs:
      - insert_at: hote_stats_json
        type: log
        log_fields:
          file: /var/log/humanix/stats.log
          message: '{"ts":"2026-10-03T12:00:00Z","type":"base","conteneur":"humanix-prod-postgres","taille":17587223,"connexions":11,"max_connexions":100,"cache_pct":100.0,"tuples_morts":505,"transaction_max_s":0}'
    outputs:
      - extract_from: metriques_bases
        conditions:
          - type: vrl
            source: |
              assert_eq!(.type, "gauge")
              assert_eq!(.namespace, "humanix")
              assert!(starts_with(string!(.name), "base_"))
              assert_eq!(.tags.conteneur, "humanix-prod-postgres")
