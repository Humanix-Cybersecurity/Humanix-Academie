#
# Extension compose pour l'observabilité : Vector → Scaleway Cockpit.
# Cf. infra/grafana/README.md pour la mise en place complète.
#
# USAGE :
#   docker compose -f docker-compose.yml -f docker-compose.observabilite.yml up -d
#
# Un SEUL agent pour les deux flux : il collecte les logs de tous les
# conteneurs via le socket Docker, ET scrape /api/metrics de l'app. Une
# conf, un token, un service à surveiller.
#
# ---------------------------------------------------------------------
# POURQUOI CE FICHIER EXISTE
# ---------------------------------------------------------------------
#
# Le service `vector` n'était déclaré NULLE PART dans le dépôt : il avait
# été ajouté à la main dans le compose de la machine, avec sa conf posée
# dans /opt/vector.yaml, hors de l'arborescence du clone. Résultat : il a
# tourné de mai à août 2026 sans rien livrer, et personne ne pouvait le
# voir en lisant le dépôt.
#
# Le versionner ici, comme ofelia, c'est ce qui garantit qu'un
# `scripts/deploy.sh` le maintienne à jour au lieu de le laisser dériver.

services:
  vector:
    # Version ÉPINGLÉE au mineur. La prod tournait en `latest-alpine` :
    # une mise à jour majeure pouvait casser la collecte du jour au
    # lendemain, sans que rien ne le signale.
    #
    # Attention au format du tag : c'est `0.55.X-alpine`, avec le `.X`.
    # `0.55-alpine` n'existe pas sur Docker Hub.
    image: timberio/vector:0.55.X-alpine
    # PAS de `container_name`, volontairement. Compose nomme alors le
    # conteneur `<projet>-vector-1`, ce qui donne `humanix-prod-vector-1`
    # sur la prod : exactement le nom actuel, donc les commandes
    # d'exploitation existantes continuent de fonctionner. Un nom fixe
    # entrerait aussi en collision le jour où la démo aura son agent,
    # les deux stacks partageant la même machine.
    restart: unless-stopped
    # `env_file` plutôt que `environment` : injecte toutes les variables du
    # .env dans le conteneur, sans dépendre de l'interpolation compose (qui
    # varie selon l'emplacement du .env).
    #
    # Variables requises, cf. infra/grafana/README.md §4 :
    #   SCW_COCKPIT_TOKEN     token Cockpit, écriture seule
    #   SCW_LOKI_URL          URL de base, SANS chemin
    #   SCW_MIMIR_URL         URL COMPLÈTE, avec /api/v1/push
    #   METRICS_SCRAPE_TOKEN  Bearer attendu par /api/metrics (>= 16 car.)
    env_file:
      - .env
    volumes:
      # Conf versionnée. Le montage doit pointer DANS le clone : c'est tout
      # l'intérêt de la manœuvre. Ne pas revenir à un chemin type
      # /opt/vector.yaml, qui redivergerait aussitôt.
      - ./infra/vector/vector.yaml:/etc/vector/vector.yaml:ro
      # Lecture des logs de tous les conteneurs. En lecture seule : Vector
      # n'a aucune raison de piloter le démon Docker.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Socket API de Podman rootless, pour les conteneurs de la demo.
      # `${PODMAN_SOCK:-/run/user/1000/podman/podman.sock}` : l'uid de
      # `humanix` vaut 1000 sur humanix-prod-01, mais le rendre reglable
      # evite de coder en dur une valeur qui n'a rien d'universel.
      #
      # A activer cote hote, une fois : `systemctl --user enable --now
      # podman.socket`. Sans ca le chemin n'existe pas, et le montage
      # echouerait -- d'ou le `:ro` et non un montage obligatoire.
      - ${PODMAN_SOCK:-/run/user/1000/podman/podman.sock}:/var/run/podman.sock:ro
      # Journal HAProxy. C'est la SEULE source qui voie tout le trafic HTTP :
      # HAProxy tourne en service systemd sur l'hôte, pas en conteneur, donc
      # `docker_logs` ne le voit pas.
      #
      # Les lignes ne sont PAS expédiées : elles sont converties en métriques
      # puis jetées (cf. infra/vector/vector.yaml). Aucune adresse IP ni aucun
      # chemin de requête ne sort de la machine.
      - /var/log/haproxy.log:/var/log/haproxy.log:ro

    # Le journal HAProxy est en `syslog:adm 640`. Sans appartenir au groupe
    # `adm`, Vector ne peut pas l'ouvrir — et une source `file` qui ne peut pas
    # lire sa cible échoue sans rien produire.
    group_add:
      - "4"

    depends_on:
      app:
        condition: service_started
    # Vector DOIT etre sur le meme reseau que l'app, sinon `app:3000` est
    # injoignable et le scrape echoue en silence.
    #
    # C'etait le cas en prod le 12/08 : Vector sur `humanix-prod_default`
    # (le reseau par defaut du projet), l'app sur `humanix_prod`. Les deux
    # ne se voyaient pas. Le nom du reseau est donc PARAMETRABLE, parce
    # qu'il differe entre le depot et la stack deployee.
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "vector"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Garde-fou contre la panne observée : sans exclusion correcte, Vector
    # se relit lui-même et chaque erreur en génère de nouvelles. On a
    # mesuré 298 Ko/h. L'exclusion est dans vector.yaml ; cette limite
    # borne les dégâts si elle saute à nouveau.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Reseau de l'app, a joindre pour pouvoir la scraper. Il doit aussi
  # laisser sortir vers internet (Cockpit) : `internal: true` casserait le
  # push sans autre symptome qu'un silence.
  #
  # Defaut = la convention du depot. La stack prod ayant diverge, elle
  # surcharge via son .env : APP_NETWORK=humanix_prod
  #
  # MEME variable que docker-compose.cron.yml, volontairement : les deux
  # overlays expriment le meme besoin — joindre l'app. Deux noms pour un
  # seul concept, c'est la derive qui a coute trois mois d'aveuglement.
  app_network:
    external: true
    name: ${APP_NETWORK:-humanix_backend}
