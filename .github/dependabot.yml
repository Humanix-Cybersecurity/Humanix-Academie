# Dependabot v2 - Humanix Académie Community Edition
#
# Stratégie pour solo mainteneur - VERSION 2 (5 mai 2026) :
#
#   Leçon de la v1 : les groupes "nommés" (next-stack, prisma-stack…) sans
#   filtre `update-types` ont laissé passer des MAJORS dangereuses
#   (Prisma 5→7, next-mdx-remote 5→6, zod 3→4, next-auth beta.25→beta.31).
#
#   Règle d'or de la v2 : TOUS les groupes ont un filtre `update-types`
#   strict à `["minor", "patch"]`. Les MAJORS sont bloquées par `ignore:`
#   sur tous les packages critiques. Si une MAJOR est nécessaire, on la
#   fait à la main, en pleine conscience.
#
#   Leçons du 9 novembre 2026, bloc npm :
#     - un groupe SANS `patterns` n'est pas un fourre-tout : Dependabot le
#       juge plus spécifique qu'un motif à joker, et il vidait les piles
#       (cf. « UNE PILE = UNE PR » plus bas) ;
#     - sans `cooldown`, Dependabot propose des versions de 3 jours, sous la
#       règle des 7 jours du projet (cf. « Délai de carence » plus bas).
#
# Documentation : https://docs.github.com/code-security/dependabot

version: 2

updates:
  # =========================================================================
  # 1. Stack Next.js (racine) - minor + patch uniquement
  # =========================================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    assignees:
      - "Meg4R0M"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"

    # ----- Délai de carence : rien de moins de 7 jours -----
    #
    # La règle du projet : on n'installe pas une version publiée depuis moins
    # de 7 jours. Sans ce bloc, Dependabot applique son délai par défaut de
    # 3 jours : le 2026-11-09, il a ouvert quatre PR sur des versions plus
    # jeunes que cela (la plus récente avait moins de 4 jours), que la CI a
    # installées et qu'il a fallu laisser mûrir une par une avant de fusionner.
    #
    # Avec 7 jours, Dependabot propose pour chaque paquet la version la plus
    # récente publiée depuis au moins 7 jours, à la seconde près : une PR qui
    # arrive est une PR dont l'âge est déjà bon.
    #
    # Trois limites à garder en tête :
    #   - le délai ne s'applique PAS aux mises à jour de sécurité, celles
    #     qu'une alerte Dependabot déclenche : elles arrivent tout de suite ;
    #   - il porte sur les paquets que Dependabot monte, pas sur les
    #     dépendances transitives que npm résout au passage : relire les âges
    #     dans le verrou avant de fusionner reste nécessaire ;
    #   - un correctif de sécurité publié SANS alerte (next 16.4.5 et
    #     undici 8.12.4, le 2026-11-09) attend comme les autres : entre 7 et
    #     14 jours après sa sortie, avec un passage hebdomadaire. Les notes de
    #     version se lisent quand même.
    cooldown:
      default-days: 7

    # ----- Groupes : tous filtrés à minor + patch -----
    #
    # UNE PILE = UNE PR. Les deux groupes « others » portent `patterns: ["*"]`,
    # et ce n'est pas décoratif.
    #
    # Dependabot range chaque dépendance dans le groupe le plus SPÉCIFIQUE qui
    # la contient, pas dans le premier de la liste comme le dit sa
    # documentation. Barème lu dans son code le 2026-11-09 (dependabot-core,
    # updater/lib/dependabot/updater/pattern_specificity_calculator.rb) :
    # nom exact 1000, groupe SANS `patterns` 500, motif à joker autour de 95,
    # `*` seul 1.
    #
    # Un groupe sans `patterns` battait donc tout motif à joker. Journal du
    # passage du 2026-11-09 :
    #
    #   Skipping @tailwindcss/postcss for group 'tailwind-stack' - belongs to
    #   more specific group 'development-others'
    #
    # et de même pour @prisma/client et @auth/prisma-adapter, partis dans
    # production-others. Résultat : tailwindcss dans une PR,
    # @tailwindcss/postcss dans une autre, deux PR vertes dont la fusion
    # conjointe donnait un verrou incohérent. `prisma` et `@prisma/client`,
    # qui doivent rester alignés, pouvaient monter séparément de la même façon.
    #
    # Avec `*`, un groupe « others » devient le MOINS spécifique : il ne reçoit
    # que ce qu'aucune pile ne réclame. L'ordre de la liste donne le même
    # résultat si Dependabot revenait à la règle de sa documentation.
    #
    # Pour le vérifier après un passage : chercher « belongs to more specific
    # group » dans le journal du job. Aucune pile ne doit y céder un paquet à
    # un groupe « others » ; l'inverse est attendu.
    groups:
      next-stack:
        patterns:
          - "next"
          - "next-*"
          - "@next/*"
          # Publié avec next, au même numéro : il monte avec lui.
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      prisma-stack:
        patterns:
          - "prisma"
          - "@prisma/*"
        update-types:
          - "minor"
          - "patch"
      auth-stack:
        patterns:
          - "next-auth"
          - "@auth/*"
        update-types:
          - "minor"
          - "patch"
      tailwind-stack:
        patterns:
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"
      production-others:
        patterns:
          - "*"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-others:
        patterns:
          - "*"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

    # ----- Bloquer les MAJORS sur tout package critique -----
    # Une MAJOR sera mise à jour manuellement, dans une PR dédiée et testée.
    ignore:
      # Stack Next.js - MAJORS bloquées (migrations souvent breaking)
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

      # Prisma - MAJOR strictement bloquée (CLI doit rester aligné avec le client)
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

      # NextAuth en beta - pas de bumps automatiques (trop volatil)
      # On gère manuellement, sur preview locale d'abord
      - dependency-name: "next-auth"
        # Toutes les mises à jour bloquées, on contrôle à la main
        versions: [">= 0"]
      - dependency-name: "@auth/*"
        update-types: ["version-update:semver-major"]

      # nodemailer - MAJORS bloquées, et la raison n'est pas « c'est risqué »
      #
      # NextAuth consomme nodemailer via son provider Email, et sa plage de
      # support s'arrête à `^7.0.7 || ^8.0.5` (next-auth 5.0.0-beta.32 et
      # @auth/core 0.41.3, les DERNIÈRES publiées au 2026-09-11). Il n'existe
      # aucune version amont qui accepte au-delà.
      #
      # L'arbre est déjà à 9.1.1, soit une majeure HORS de cette plage, et
      # `legacy-peer-deps=true` dans .npmrc fait taire l'avertissement : rien
      # ne signale l'écart. Accepter la 10 en ajouterait une seconde sur la
      # bibliothèque qui porte les liens de connexion et les invitations.
      #
      # La 10.0.1 n'apportait par ailleurs qu'une rupture de TYPES (« drop the
      # internal members from the published declarations ») : aucun gain
      # fonctionnel contre un écart aggravé. Cf. PR #884, fermée pour ça.
      #
      # À rouvrir quand NextAuth élargira sa plage. Les patches continuent de
      # passer : seules les majors sont bloquées.
      - dependency-name: "nodemailer"
        update-types: ["version-update:semver-major"]

      # Validation / serialization - MAJORS souvent breaking
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next-mdx-remote"
        update-types: ["version-update:semver-major"]

      # Style / UI - MAJORS souvent à migrer manuellement
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

      # Outils dev - MAJORS souvent à migrer manuellement
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]

      # Node types - suivent la LTS, MAJOR à migrer avec engines.node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # =========================================================================
  # 2. Connecteurs Python (8 dossiers) - minor + patch uniquement, mensuel
  # =========================================================================
  - package-ecosystem: "pip"
    directories:
      - "/connectors/ciso-assistant"
      - "/connectors/splunk"
      - "/connectors/sentinel"
      - "/connectors/lucca"
      - "/connectors/glpi"
      - "/connectors/sekoia"
      - "/connectors/harfanglab"
      - "/connectors/mailinblack-vade"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    assignees:
      - "Meg4R0M"
    labels:
      - "dependencies"
      - "python"
      - "connectors"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      python-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Bloquer les MAJORS sur tous les paquets Python (rare mais possible)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # =========================================================================
  # 3. GitHub Actions workflows - minor + patch uniquement, mensuel
  # =========================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    assignees:
      - "Meg4R0M"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      gh-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Bloquer les MAJORS sur les actions (souvent breaking côté inputs)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # =========================================================================
  # 4. Docker (les trois Dockerfile) - patch uniquement, mensuel
  # =========================================================================
  # Plus strict que le reste : pour Docker, même les minors sont risquées
  # (changement de runtime Node.js, libssl, glibc, etc.). On reste sur les
  # patches de sécurité uniquement.
  #
  # LES IMAGES SONT ÉPINGLÉES PAR DIGEST, ET C'EST CE BLOC QUI LES RENOUVELLE
  #
  # Tant que le Dockerfile portait `FROM node:24-alpine`, ce bloc ne pouvait
  # RIEN faire : un tag mouvant n'a pas de version à monter. Il était écrit,
  # configuré, assigné, et inerte. Le tag glissait sous nos pieds à chaque
  # construction, ce qui a fini par changer le comportement de npm sans que
  # personne ne l'ait décidé.
  #
  # Avec `tag@sha256:...`, Dependabot a de nouveau prise : il propose le
  # nouveau digest quand le tag bouge. Le tag reste écrit à côté du digest
  # précisément pour ça, et pour dire au lecteur ce qu'il regarde.
  #
  # Le filet, si ce bloc devait rester muet : le scan quotidien Trivy analyse
  # les paquets système de l'image publiée et échoue sur tout HIGH/CRITICAL
  # corrigeable. Une image épinglée qui vieillit finit donc par faire échouer
  # la CI. Ce n'est pas une hypothèse : c'est ce contrôle qui a levé js-yaml
  # et sharp le 2026-09-10.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker/postgres"
      - "/infra/tts"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    assignees:
      - "Meg4R0M"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - "patch"
    ignore:
      # Bloquer minor + major sur les images Docker (Node 20 → 22 → 24 = MAJOR
      # à planifier, jamais auto)
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
