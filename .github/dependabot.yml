# Dependabot v2 - Humanix Académie Community Edition
#
# Stratégie pour solo mainteneur - VERSION 2 (5 mai 2026) :
#
#   Leçon de la v1 : les groupes "nommés" (next-stack, prisma-stack…) sans
#   filtre `update-types` ont laissé passer des MAJORS dangereuses
#   (Prisma 5→7, next-mdx-remote 5→6, zod 3→4, next-auth beta.25→beta.31).
#
#   Règle d'or de la v2 : TOUS les groupes ont un filtre `update-types`
#   strict à `["minor", "patch"]`. Les MAJORS sont bloquées par `ignore:`
#   sur tous les packages critiques. Si une MAJOR est nécessaire, on la
#   fait à la main, en pleine conscience.
#
# Documentation : https://docs.github.com/code-security/dependabot

version: 2

updates:
  # =========================================================================
  # 1. Stack Next.js (racine) - minor + patch uniquement
  # =========================================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    assignees:
      - "Meg4R0M"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"

    # ----- Groupes : tous filtrés à minor + patch -----
    groups:
      next-stack:
        patterns:
          - "next"
          - "next-*"
          - "@next/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      prisma-stack:
        patterns:
          - "prisma"
          - "@prisma/*"
        update-types:
          - "minor"
          - "patch"
      auth-stack:
        patterns:
          - "next-auth"
          - "@auth/*"
        update-types:
          - "minor"
          - "patch"
      tailwind-stack:
        patterns:
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"
      production-others:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-others:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

    # ----- Bloquer les MAJORS sur tout package critique -----
    # Une MAJOR sera mise à jour manuellement, dans une PR dédiée et testée.
    ignore:
      # Stack Next.js - MAJORS bloquées (migrations souvent breaking)
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

      # Prisma - MAJOR strictement bloquée (CLI doit rester aligné avec le client)
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

      # NextAuth en beta - pas de bumps automatiques (trop volatil)
      # On gère manuellement, sur preview locale d'abord
      - dependency-name: "next-auth"
        # Toutes les mises à jour bloquées, on contrôle à la main
        versions: [">= 0"]
      - dependency-name: "@auth/*"
        update-types: ["version-update:semver-major"]

      # nodemailer - MAJORS bloquées, et la raison n'est pas « c'est risqué »
      #
      # NextAuth consomme nodemailer via son provider Email, et sa plage de
      # support s'arrête à `^7.0.7 || ^8.0.5` (next-auth 5.0.0-beta.32 et
      # @auth/core 0.41.3, les DERNIÈRES publiées au 2026-09-11). Il n'existe
      # aucune version amont qui accepte au-delà.
      #
      # L'arbre est déjà à 9.1.1, soit une majeure HORS de cette plage, et
      # `legacy-peer-deps=true` dans .npmrc fait taire l'avertissement : rien
      # ne signale l'écart. Accepter la 10 en ajouterait une seconde sur la
      # bibliothèque qui porte les liens de connexion et les invitations.
      #
      # La 10.0.1 n'apportait par ailleurs qu'une rupture de TYPES (« drop the
      # internal members from the published declarations ») : aucun gain
      # fonctionnel contre un écart aggravé. Cf. PR #884, fermée pour ça.
      #
      # À rouvrir quand NextAuth élargira sa plage. Les patches continuent de
      # passer : seules les majors sont bloquées.
      - dependency-name: "nodemailer"
        update-types: ["version-update:semver-major"]

      # Validation / serialization - MAJORS souvent breaking
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next-mdx-remote"
        update-types: ["version-update:semver-major"]

      # Style / UI - MAJORS souvent à migrer manuellement
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

      # Outils dev - MAJORS souvent à migrer manuellement
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]

      # Node types - suivent la LTS, MAJOR à migrer avec engines.node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # =========================================================================
  # 2. Connecteurs Python (8 dossiers) - minor + patch uniquement, mensuel
  # =========================================================================
  - package-ecosystem: "pip"
    directories:
      - "/connectors/ciso-assistant"
      - "/connectors/splunk"
      - "/connectors/sentinel"
      - "/connectors/lucca"
      - "/connectors/glpi"
      - "/connectors/sekoia"
      - "/connectors/harfanglab"
      - "/connectors/mailinblack-vade"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    assignees:
      - "Meg4R0M"
    labels:
      - "dependencies"
      - "python"
      - "connectors"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      python-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Bloquer les MAJORS sur tous les paquets Python (rare mais possible)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # =========================================================================
  # 3. GitHub Actions workflows - minor + patch uniquement, mensuel
  # =========================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    assignees:
      - "Meg4R0M"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      gh-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Bloquer les MAJORS sur les actions (souvent breaking côté inputs)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # =========================================================================
  # 4. Docker (les trois Dockerfile) - patch uniquement, mensuel
  # =========================================================================
  # Plus strict que le reste : pour Docker, même les minors sont risquées
  # (changement de runtime Node.js, libssl, glibc, etc.). On reste sur les
  # patches de sécurité uniquement.
  #
  # LES IMAGES SONT ÉPINGLÉES PAR DIGEST, ET C'EST CE BLOC QUI LES RENOUVELLE
  #
  # Tant que le Dockerfile portait `FROM node:24-alpine`, ce bloc ne pouvait
  # RIEN faire : un tag mouvant n'a pas de version à monter. Il était écrit,
  # configuré, assigné, et inerte. Le tag glissait sous nos pieds à chaque
  # construction, ce qui a fini par changer le comportement de npm sans que
  # personne ne l'ait décidé.
  #
  # Avec `tag@sha256:...`, Dependabot a de nouveau prise : il propose le
  # nouveau digest quand le tag bouge. Le tag reste écrit à côté du digest
  # précisément pour ça, et pour dire au lecteur ce qu'il regarde.
  #
  # Le filet, si ce bloc devait rester muet : le scan quotidien Trivy analyse
  # les paquets système de l'image publiée et échoue sur tout HIGH/CRITICAL
  # corrigeable. Une image épinglée qui vieillit finit donc par faire échouer
  # la CI. Ce n'est pas une hypothèse : c'est ce contrôle qui a levé js-yaml
  # et sharp le 2026-09-10.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker/postgres"
      - "/infra/tts"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    assignees:
      - "Meg4R0M"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - "patch"
    ignore:
      # Bloquer minor + major sur les images Docker (Node 20 → 22 → 24 = MAJOR
      # à planifier, jamais auto)
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
