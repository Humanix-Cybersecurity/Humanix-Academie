name: Docker Publish (OSS)

# Publie l'image OSS de Humanix Academie sur :
#
#   - GHCR (GitHub Container Registry) - TOUJOURS ACTIF
#     ghcr.io/humanix-cybersecurity/humanix-academie
#     Gratuit illimite, integre GitHub, pas de PAT a rotater.
#
#   - Docker Hub (compte perso) - OPTIONNEL
#     <DOCKERHUB_USERNAME>/humanix-academie
#     Active automatiquement si les secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
#     sont definis. Sinon, ignore proprement (pas d'erreur).
#
# === Pourquoi cette double publication ===
#
# GHCR est notre registre principal (ADR 2026-05-23) :
#   - Gratuit illimite pour images publiques
#   - Pas de quota pull (vs Docker Hub : 100 pull/6h pour anonymes)
#   - GITHUB_TOKEN auto-fourni (pas de PAT a generer ni rotater)
#   - Provenance + SBOM supportes
#   - Acces revoque automatiquement si on quitte l'org
#
# Docker Hub reste utile pour la visibilite grand public (Stack Overflow,
# tutos qui pointent par defaut vers docker.io/...). Compte perso gratuit
# (les organisations Docker Hub sont payantes a partir de 75 $/mois pour
# 5 users mini - pas justifie pour un projet OSS solo).
#
# === Quand ce workflow se declenche ===
#
#   - push sur `main` : tag `:edge` + `:main-<sha7>`
#   - push d'un tag git `v*.*.*` : tags `:1.2.3`, `:1.2`, `:1`, `:latest`
#   - workflow_dispatch : declenchement manuel avec tag custom
#
# === Dans quel ordre (depuis le 2026-11-20) ===
#
#   1. `publish` construit l'image et l'envoie au registre SOUS SA SEULE
#      EMPREINTE : aucun tag n'est pose ;
#   2. `smoke-test` tire cette image par son empreinte et l'essaie sur une
#      base vierge (scripts/essai-image.sh) ;
#   3. `promote` pose les tags sur cette meme empreinte, et verifie qu'ils la
#      designent (scripts/publier-tags.sh). Il depend de l'essai : pas d'essai
#      vert, pas de tag.
#
#   Avant, les tags partaient des la construction. Un essai rouge ne retenait
#   rien : le 2026-11-20, au premier vrai passage de l'essai, `edge` pointait
#   deja sur l'image qui venait d'echouer.
#
#   Une image dont l'essai echoue reste au registre, sans tag : on peut la
#   tirer par l'empreinte que donne le journal pour comprendre, personne ne la
#   recoit par `edge` ou `latest`.
#
# === Mode OSS pur (sans content-pro) ===
#
# Checkout sans submodule prive. Le Dockerfile gere via `mkdir -p content-pro`
# + fallback `resolveContentRoot()` sur les 2 saisons demo CC BY-SA.
#
# === Secrets requis (Settings → Secrets and variables → Actions) ===
#
#   GHCR : aucun (GITHUB_TOKEN fourni automatiquement)
#
#   Docker Hub (optionnel) :
#     - DOCKERHUB_USERNAME : nom du compte Docker Hub perso (pas l'email)
#     - DOCKERHUB_TOKEN    : PAT Docker Hub avec scope "Read & Write",
#                            rotation annuelle obligatoire (PSSI M15)
#
# === Variables repo override (Settings → Variables) ===
#
#   - DOCKER_IMAGE_NAME_GHCR (optionnel) : surcharge le nom GHCR
#     (defaut : `ghcr.io/humanix-cybersecurity/humanix-academie`)
#
#   - DOCKER_IMAGE_NAME_HUB (optionnel) : surcharge le nom Docker Hub
#     (defaut : `${DOCKERHUB_USERNAME}/humanix-academie`)
#
# === Premier setup GHCR ===
#
# Au premier push, l'image apparait dans Settings → Packages de l'org
# en mode PRIVATE par defaut. Pour la rendre publique :
#   Packages → humanix-academie → Settings → Change visibility → Public
# A faire UNE SEULE FOIS apres le premier push reussi.
#
# === Conformite ANSSI / OCI ===
#
# - Labels OCI standardises (org.opencontainers.image.*)
# - Provenance SLSA mode=max + SBOM SPDX inclus automatiquement
# - Image AGPLv3 declaree dans le label `licenses`
# - Cf. ANSSI HG mesures M6 (cartographie tiers) + M38 (audits reguliers)

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "wiki/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "LICENSE"
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Tag custom (sera prefixe par 'manual-')"
        required: false
        default: ""
      platforms:
        # arm64 RETIRE du defaut : le build arm64 sous QEMU fait echouer
        # `prisma generate` (le moteur wasm mal-parse le schema sous emulation
        # -> P1012 lignes fantomes ""), ce qui, buildx etant tout-ou-rien,
        # bloquait aussi l'image amd64 pourtant valide (echecs 8 + 11 juin).
        # La prod tourne en amd64. Pour reactiver arm64 proprement, utiliser un
        # runner natif arm64 (pas QEMU) via une matrice de build.
        description: "Plateformes (defaut : linux/amd64)"
        required: false
        default: "linux/amd64"

permissions:
  contents: read
  packages: write # GHCR push (necessaire meme pour le token integre)
  security-events: write # remontee des findings Trivy dans l'onglet Security

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DEFAULT_GHCR_IMAGE: ghcr.io/humanix-cybersecurity/humanix-academie

jobs:
  # ===========================================================================
  # Pre-flight : detection des registres actifs
  # ===========================================================================
  preflight:
    name: Preflight
    runs-on: self-hosted
    timeout-minutes: 5
    if: github.repository_owner == 'Humanix-Cybersecurity'
    outputs:
      ghcr_image: ${{ steps.config.outputs.ghcr_image }}
      hub_enabled: ${{ steps.config.outputs.hub_enabled }}
      # Pas de sortie `hub_image` : elle contient DOCKERHUB_USERNAME, et GitHub
      # ne transmet pas d'un job a l'autre une sortie qui contient un secret.
      # Le job `promote` recalcule ce nom la ou il s'en sert.
    steps:
      - name: Resolve registry config
        id: config
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_OVERRIDE: ${{ vars.DOCKER_IMAGE_NAME_GHCR }}
          HUB_OVERRIDE: ${{ vars.DOCKER_IMAGE_NAME_HUB }}
        run: |
          # GHCR : toujours actif
          GHCR_IMAGE="${GHCR_OVERRIDE:-${{ env.DEFAULT_GHCR_IMAGE }}}"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "::notice::GHCR target: ${GHCR_IMAGE}"

          # Docker Hub : optionnel, active uniquement si les 2 secrets sont definis
          if [[ -n "${DH_USER}" && -n "${DH_TOKEN}" ]]; then
            HUB_IMAGE="${HUB_OVERRIDE:-${DH_USER}/humanix-academie}"
            echo "hub_enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub target: ${HUB_IMAGE} (secrets detectes)"
          else
            echo "hub_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub: desactive (secrets DOCKERHUB_USERNAME/TOKEN non definis)"
          fi

  # ===========================================================================
  # Build multi-arch, puis envoi a GHCR SOUS LA SEULE EMPREINTE
  #
  # Ce job ne pose AUCUN tag : c'est le job `promote` qui le fait, une fois
  # l'essai passe. Il rend l'empreinte de ce qu'il a pousse et la liste des
  # tags a poser. Docker Hub, s'il est actif, ne recoit rien ici non plus.
  # ===========================================================================
  publish:
    name: Build & push par empreinte (sans tag)
    needs: preflight
    runs-on: self-hosted
    timeout-minutes: 90 # Build arm64 par QEMU peut prendre ~30 min
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      # References completes sur GHCR, une par ligne. Aucun secret dedans :
      # le nom Docker Hub n'y figure pas (cf. preflight).
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout (sans submodule prive)
        # On NE checkoute PAS content-pro/ (submodule prive humanix-content-pro).
        # L'image OSS doit tourner sans. Le Dockerfile gere ce cas via
        # `mkdir -p content-pro` et resolveContentRoot() bascule sur les
        # 2 saisons demo CC BY-SA.
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0 # Tags pour metadata-action

      - name: Verify OSS mode (no content-pro contents)
        run: |
          if [ -f content-pro/prisma/catalog-saisons.ts ]; then
            echo "::error::content-pro/ a ete checkoute - ce workflow doit publier en mode OSS PUR uniquement"
            exit 1
          fi
          echo "✓ Mode OSS confirme (content-pro vide)"

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # === Login GHCR (toujours) ===
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # === Metadata : labels de l'image, et tags A POSER PLUS TARD ===
      #
      # docker/metadata-action calcule les tags pour l'image listee dans
      # `images:`. Ils ne sont PAS passes a la construction : ils sortent du
      # job (`outputs.tags`) et c'est `promote` qui les pose, apres l'essai.
      # Seul GHCR est liste : le job `promote` reporte les memes tags sur
      # Docker Hub quand il est actif.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ needs.preflight.outputs.ghcr_image }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=manual-${{ github.event.inputs.custom_tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.custom_tag != '' }}
          labels: |
            org.opencontainers.image.title=Humanix Académie
            org.opencontainers.image.description=Plateforme française de sensibilisation cyber - souveraine, AGPLv3, conforme ANSSI HG 42 mesures
            org.opencontainers.image.vendor=Humanix Cybersecurity SASU (Toulouse, France)
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/Humanix-Cybersecurity/Humanix-Academie
            org.opencontainers.image.url=https://humanix-academie.fr
            org.opencontainers.image.documentation=https://github.com/Humanix-Cybersecurity/Humanix-Academie/wiki
            org.opencontainers.image.authors=Humanix Cybersecurity <security@humanix-cybersecurity.fr>
            io.humanix.flavor=oss
            io.humanix.compliance.anssi-hg=42-mesures-mappees
            io.humanix.sovereignty=eu-only

      - name: Build & push (par empreinte, sans tag)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          # NI `push: true` NI `tags:` : l'image part au registre sans nom,
          # designee par sa seule empreinte (`push-by-digest`). Remettre des
          # tags ici, c'est les publier AVANT l'essai : scripts/
          # publier-tags.test.ts le refuse.
          outputs: type=image,name=${{ needs.preflight.outputs.ghcr_image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # Cache buildx LOCAL, sur le disque persistant de l'executeur, et
          # plus via le cache GitHub Actions : chaque build en restaurait et
          # en renvoyait ~1,3 Go, et le 2026-10-30 GitHub a coupe la sortie
          # du cache du compte (« Egress is over the account limit »).
          # `runner.tool_cache` survit d'un job a l'autre sur nos executeurs.
          # Le repertoire `-new` puis la rotation (etape suivante) evitent
          # que le cache local grossisse sans fin, piege connu de type=local.
          cache-from: type=local,src=${{ runner.tool_cache }}/humanix-buildx
          cache-to: type=local,dest=${{ runner.tool_cache }}/humanix-buildx-new,mode=max
          # Supply chain : provenance SLSA + SBOM SPDX inclus dans le manifest.
          provenance: mode=max
          sbom: true
          # Args build : NEXT_PUBLIC_* vides (override au runtime via env).
          build-args: |
            # Cette image est publiee en mode OSS PUR (cf. l'etape
            # "Verify OSS mode" ci-dessus, qui echoue si content-pro est
            # present). On declare donc explicitement l'absence du contenu
            # commercial, sans quoi `prebuild` refuserait de builder.
            HUMANIX_OSS=true
            NEXT_PUBLIC_APP_URL=
            NEXT_PUBLIC_APP_NAME=Humanix Académie
            NEXT_PUBLIC_BASE_URL=
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=
            NEXT_PUBLIC_PLAUSIBLE_API_HOST=
            NEXT_PUBLIC_PLAUSIBLE_CLOUD_SCRIPT=
            NEXT_PUBLIC_MATOMO_URL=
            NEXT_PUBLIC_MATOMO_SITE_ID=

      - name: Rotation du cache buildx local
        if: always()
        run: |
          rm -rf "${{ runner.tool_cache }}/humanix-buildx"
          if [ -d "${{ runner.tool_cache }}/humanix-buildx-new" ]; then
            mv "${{ runner.tool_cache }}/humanix-buildx-new" "${{ runner.tool_cache }}/humanix-buildx"
          fi

      - name: Image summary
        env:
          CANDIDAT: ${{ needs.preflight.outputs.ghcr_image }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "::notice::Image poussee sans tag : ${CANDIDAT}"
          {
            echo "## Image construite, pas encore publiee"
            echo ""
            echo "Elle est au registre sous sa seule empreinte :"
            echo ""
            echo "\`${CANDIDAT}\`"
            echo ""
            echo "Le job 'Smoke test pulled image' l'essaie. S'il est vert, le job"
            echo "'Publier les tags' pose :"
            echo ""
            echo '```'
            echo "${TAGS:-(aucun tag pour ce declenchement)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Essai de l'image publiee (depuis GHCR, registre primaire)
  #
  # POURQUOI CE JOB A ETE REECRIT (2026-11-19)
  #
  # Il etait vert depuis sa creation, le 2026-05-23, sans que le conteneur ait
  # repondu une seule fois : une base factice, une variable SKIP_MIGRATIONS
  # que rien n'a jamais lue, et une boucle d'attente sans branche d'echec. Le
  # point d'entree attendait PostgreSQL trente secondes puis sortait ; l'etape
  # se terminait a 0 soixante secondes plus tard.
  #
  # L'essai vit maintenant dans scripts/essai-image.sh, que
  # scripts/essai-image.test.ts couvre : reseau interne, PostgreSQL du depot,
  # base vierge, preparation au demarrage, puis /api/health et la page
  # d'accueil. Il ECHOUE si l'image ne sert pas, et retire ce qu'il a cree.
  #
  # L'IMAGE EST DESIGNEE PAR SON EMPREINTE, pas par un tag. `edge` et `latest`
  # bougent : deux publications rapprochees feraient essayer a l'une l'image
  # de l'autre. On essaie ce que CE run a construit.
  #
  # RIEN N'EST TAGUE AVANT CE JOB (2026-11-20). L'image n'existe encore au
  # registre que sous son empreinte, et `promote` attend que cet essai soit
  # vert. D'ou l'absence de condition `if:` : un declenchement manuel est
  # essaye comme les autres. Un job saute ferait sauter `promote`, donc ne
  # publierait rien, mais autant ne pas laisser de chemin sans essai.
  # ===========================================================================
  smoke-test:
    name: Smoke test pulled image
    needs: [preflight, publish]
    runs-on: self-hosted
    # Mesure en local le 2026-11-19 : 100 s pour l'essai lui-meme, dont 80
    # d'import de l'observatoire qui echoue faute de reseau. S'y ajoutent le
    # tirage de l'image et, si le demarrage trainait, jusqu'a cinq minutes
    # d'attente (ESSAI_ATTENTE, cf. le script) : dix minutes laissaient trop
    # peu de marge.
    timeout-minutes: 15
    env:
      IMAGE: ${{ needs.preflight.outputs.ghcr_image }}@${{ needs.publish.outputs.digest }}
    steps:
      - name: Checkout (pour scripts/essai-image.sh et docker/postgres)
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Login to GHCR (pour pull)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image (par empreinte)
        run: |
          # Sans empreinte, on essaierait une autre image que celle de ce run.
          case "$IMAGE" in
            *@sha256:*) ;;
            *)
              echo "::error::empreinte absente, image non identifiee : $IMAGE"
              exit 1
              ;;
          esac
          docker pull "$IMAGE"

      - name: Essai de l'image sur une base vierge
        env:
          # Deux publications peuvent tourner en meme temps : les noms que le
          # script cree portent ce suffixe.
          ESSAI_SUFFIXE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: ./scripts/essai-image.sh "$IMAGE"

      # Le script retire lui-meme ses conteneurs, son reseau et son image
      # PostgreSQL, que l'essai ait reussi ou non. Il ne reste ici que le
      # menage des images anciennes de l'executeur.
      - name: Cleanup
        if: always()
        run: docker image prune -af --filter "until=24h" 2>/dev/null || true

  # ===========================================================================
  # Pose des tags : seulement apres l'essai
  #
  # C'est ICI, et nulle part ailleurs dans ce workflow, qu'un tag est pose.
  # Le job depend de `smoke-test` : si l'essai echoue, est annule ou saute, il
  # ne tourne pas, et `edge`, `latest` ou la version restent ou ils etaient.
  # Ne pas lui donner de condition du genre `if: always()`, qui le ferait
  # tourner apres un essai rouge.
  #
  # Les tags sont poses sur l'empreinte que `publish` a poussee et que
  # `smoke-test` a essayee : rien n'est reconstruit. Le script verifie ensuite,
  # tag par tag, que le registre rend bien cette empreinte.
  #
  # RELANCER : apres un essai rouge pour une raison passagere, « Re-run failed
  # jobs » rejoue l'essai puis ce job sur la MEME image, sans reconstruire.
  #
  # LE SCAN TRIVY NE RETIENT PAS LES TAGS. Il tourne a cote, comme avant : il
  # met le run en rouge sur une faille corrigeable, sans empecher la
  # publication. Le brancher ici (`needs: [..., trivy-scan]`) est un choix de
  # politique, pas une precaution technique : le jour ou une faille sort dans
  # l'image de base, plus rien ne se publierait avant la montee ou
  # l'acceptation datee.
  # ===========================================================================
  promote:
    name: Publier les tags (apres l'essai)
    needs: [preflight, publish, smoke-test]
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      CANDIDAT: ${{ needs.preflight.outputs.ghcr_image }}@${{ needs.publish.outputs.digest }}
    steps:
      - name: Checkout (pour scripts/publier-tags.sh)
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # === Login Docker Hub (optionnel) ===
      - name: Login to Docker Hub
        if: needs.preflight.outputs.hub_enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Poser les tags sur l'image essayee
        env:
          TAGS: ${{ needs.publish.outputs.tags }}
          HUB_ENABLED: ${{ needs.preflight.outputs.hub_enabled }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_OVERRIDE: ${{ vars.DOCKER_IMAGE_NAME_HUB }}
        run: |
          # Docker Hub, s'il est actif, recoit les memes tags : le script les
          # reporte sur MIROIR. Meme calcul du nom que dans preflight.
          MIROIR=""
          if [ "$HUB_ENABLED" = "true" ]; then
            MIROIR="${HUB_OVERRIDE:-${DH_USER}/humanix-academie}"
          fi
          export MIROIR
          ./scripts/publier-tags.sh "$CANDIDAT"

      # =====================================================================
      # Livraison : temps 2, a la main sur le serveur (cf. #753)
      #
      # Ce workflow ne deploie deliberement RIEN : pas de cle SSH dans
      # GitHub, pas d'acces entrant vers humanix-prod-01. Et l'image publiee
      # ici n'est PAS ce qui part en demo ou en prod : elle est construite
      # sans content-pro, pour les personnes qui s'auto-hebergent. La demo et
      # la prod sont livrees depuis le clone git, par scripts/deploy.sh, qui
      # prend une reference git et non un tag d'image.
      # =====================================================================
      - name: Resume et rappel de livraison (aucun deploiement automatique)
        env:
          TAGS: ${{ needs.publish.outputs.tags }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            COMMANDE="./scripts/deploy.sh prod ${GITHUB_REF_NAME}"
          else
            COMMANDE="./scripts/deploy.sh demo"
          fi
          {
            echo "## Image essayee, puis publiee"
            echo ""
            echo "\`${CANDIDAT}\`"
            echo ""
            echo "Elle a demarre sur une base vierge et servi avant de recevoir"
            echo "ses tags :"
            echo ""
            echo '```'
            echo "${TAGS:-(aucun tag pour ce declenchement)}"
            echo '```'
            echo ""
            echo "## Livraison (temps 2, manuel)"
            echo ""
            echo "Rien n'a ete deploye. La demo et la prod ne tournent pas sur"
            echo "cette image, construite sans content-pro : elles se livrent a la"
            echo "main sur \`humanix-prod-01\`, depuis le clone git."
            echo ""
            echo '```bash'
            echo "${COMMANDE}"
            echo '```'
            echo ""
            echo "Commit de ce run : \`${GITHUB_SHA}\`"
            echo ""
            echo "Detail de la procedure : \`docs/DEPLOYMENT_RUNBOOK.md\` section G-bis."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Livraison manuelle : ${COMMANDE}"

  # ===========================================================================
  # Scan de vulnerabilites de l'image poussee (Trivy) - #755
  #
  # POURQUOI : ce workflow produisait deja un SBOM SPDX... que personne ne
  # scannait. Un SBOM non scanne ne protege de rien : il liste les composants
  # sans jamais les confronter aux CVE connues.
  #
  # POURQUOI L'IMAGE OFFICIELLE ET PAS UNE ACTION TIERCE : moins de surface
  # supply-chain (l'action tierce s'execute avec le token du job sur un
  # runner self-hosted), version epinglee, et coherent avec un depot qui
  # publie provenance SLSA + SBOM. Le socket Docker est deja accessible au
  # runner puisqu'il build les images.
  #
  # POLITIQUE D'ECHEC : on bloque sur HIGH/CRITICAL *corrigeables*
  # (--ignore-unfixed). Une CVE sans correctif publie n'est pas actionnable :
  # la signaler est utile, bloquer toutes les publications dessus ne l'est
  # pas. Les findings partent aussi dans l'onglet Security (SARIF), a cote
  # de CodeQL.
  #
  # QUELLE IMAGE (2026-11-20) : celle que CE run a poussee, tiree par son
  # empreinte, et non plus `edge` ou `latest`. Ces tags ne sont poses
  # qu'apres l'essai, par `promote` : ici ils designeraient encore l'image
  # d'avant. Trivy la lit dans le moteur local sous un tag de travail, pose
  # apres le tirage et retire a la fin, jamais pousse. Il est dans le meme
  # depot pour que les alertes de l'onglet Security gardent leur emplacement.
  #
  # Ce job ne retient pas les tags (cf. `promote`).
  # ===========================================================================
  trivy-scan:
    name: Scan vulnerabilites image (Trivy)
    needs: [preflight, publish]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      IMAGE: ${{ needs.preflight.outputs.ghcr_image }}@${{ needs.publish.outputs.digest }}
      # Tag de travail, local a l'executeur. Suffixe par le run : deux
      # publications peuvent tourner en meme temps sur le meme moteur.
      CIBLE: ${{ needs.preflight.outputs.ghcr_image }}:scan-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Necessaire pour .trivyignore.yaml (acceptations de risque datees).
      - name: Checkout (pour .trivyignore.yaml)
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Login to GHCR (pour pull)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image a scanner (par empreinte)
        run: |
          # Sans empreinte, on scannerait une autre image que celle de ce run.
          case "$IMAGE" in
            *@sha256:*) ;;
            *)
              echo "::error::empreinte absente, image non identifiee : $IMAGE"
              exit 1
              ;;
          esac
          docker pull "$IMAGE"
          docker tag "$IMAGE" "$CIBLE"

      # Rapport lisible dans les logs : TOUTES les severites, y compris les
      # non-corrigeables, pour garder la visibilite sans bloquer dessus.
      - name: Rapport Trivy (informatif, toutes severites)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v humanix-trivy-cache:/root/.cache/ \
            aquasec/trivy:0.58.1 image \
              --scanners vuln \
              --severity MEDIUM,HIGH,CRITICAL \
              --format table \
              --timeout 15m \
              "$CIBLE" \
            || echo "::warning::Trivy (rapport informatif) s'est termine en erreur"

      - name: Export SARIF (onglet Security)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v humanix-trivy-cache:/root/.cache/ \
            -v "$PWD:/out" \
            aquasec/trivy:0.58.1 image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --format sarif \
              --output /out/trivy-results.sarif \
              --timeout 15m \
              "$CIBLE"

      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Garde bloquante : les HIGH/CRITICAL corrigeables, MOINS les risques
      # explicitement acceptes dans .trivyignore.yaml (chacun justifie et
      # DATE : passe l'expiration, la garde refait echouer le build).
      #
      # Sans ce fichier, la garde bloquait chaque publication sur des CVE
      # provenant de l'image de base et de l'outillage de build, qu'on ne
      # peut pas corriger depuis ce depot. Une garde impossible a satisfaire
      # finit ignoree : elle doit rester actionnable.
      - name: Bloquer sur HIGH/CRITICAL corrigeables
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v humanix-trivy-cache:/root/.cache/ \
            -v "$PWD/.trivyignore.yaml:/tmp/.trivyignore.yaml:ro" \
            aquasec/trivy:0.58.1 image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile /tmp/.trivyignore.yaml \
              --exit-code 1 \
              --format table \
              --timeout 15m \
              "$CIBLE"

      - name: Cleanup
        if: always()
        run: |
          rm -f trivy-results.sarif
          docker rmi "$CIBLE" >/dev/null 2>&1 || true
