#
# ACCEPTATIONS DE RISQUE TEMPORAIRES POUR LE SCAN TRIVY DE L'IMAGE
#
# Chaque entree est une decision documentee, avec une DATE D'EXPIRATION :
# passe cette date, Trivy refait echouer le build et force une re-revue.
# On n'ignore rien "pour toujours".
#
# ---------------------------------------------------------------------
# ETAT AU 2026-08-25 : PLUS AUCUNE ACCEPTATION
# ---------------------------------------------------------------------
#
# Ce fichier a porte 24 acceptations, posees le 2026-08-12 quand le scan
# bloquait chaque publication. Elles avaient deux origines, et LES DEUX ONT
# DISPARU DE L'IMAGE depuis :
#
#   1. Paquets embarques dans NPM (tar, brace-expansion, picomatch,
#      ip-address, sigstore). npm etait requis parce que l'entrypoint
#      appelait `npx`. Il ne l'appelle plus : les scripts de demarrage sont
#      compiles en .mjs par esbuild, et npm a ete retire de l'image.
#
#   2. Binaire Go d'ESBUILD, tire par `tsx`, requis au runtime. tsx est une
#      dependance de developpement : `npm prune --omit=dev` la retire.
#
#   La 24e, deepmerge-ts / CVE-2026-40345, a ete corrigee le 2026-08-25 par
#   un override vers 8.0.1 (cf. PR #850).
#
# VERIFIE DANS LE CONTENEUR DE PRODUCTION, pas deduit du Dockerfile :
#
#   /app/node_modules      : ni npm, ni tar, ni brace-expansion, ni
#                            picomatch, ni ip-address, ni sigstore, ni
#                            esbuild, ni tsx
#   /usr/local/lib/node_modules : corepack seulement
#   /usr/local/bin         : corepack, node, nodejs, yarn -- pas de npm/npx
#
#   Et le tag v1.5.0 (2026-08-17), sur lequel pointe l'image `:latest`,
#   embarquait deja `npm prune --omit=dev` et les scripts compiles : les
#   deux images scannees (`:edge` et `:latest`) sont donc concernees.
#
# ---------------------------------------------------------------------
# SI UNE ACCEPTATION REDEVIENT NECESSAIRE
# ---------------------------------------------------------------------
#
# La reflexe est d'ajouter une entree ici. Le bon reflexe est d'abord de se
# demander si le paquet a encore une raison d'etre dans l'image runtime :
# les 23 acceptations ci-dessus ont disparu non pas parce que les CVE ont
# ete corrigees, mais parce que l'outillage de build a cesse d'etre livre
# en production.
#
# Si une acceptation est vraiment necessaire, lui donner une date
# d'expiration PROPRE, et surtout ESPACEE des autres. Les 23 precedentes
# expiraient toutes le meme jour : 23 alertes rouges le meme matin se
# lisent comme du bruit, pas comme une alerte.

vulnerabilities: []
