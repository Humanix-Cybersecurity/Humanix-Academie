#
# ACCEPTATIONS DE RISQUE TEMPORAIRES POUR LE SCAN TRIVY DE L'IMAGE
#
# Chaque entree est une decision documentee, avec une DATE D'EXPIRATION :
# passe cette date, Trivy refait echouer le build et force une re-revue.
# On n'ignore rien "pour toujours".
#
# Le scan INFORMATIF du workflow reste a couverture complete : ces CVE
# continuent d'apparaitre dans les logs et dans l'onglet Security. Seule
# la garde BLOQUANTE les laisse passer.
#
# ---------------------------------------------------------------------
# POURQUOI CES ACCEPTATIONS
# ---------------------------------------------------------------------
#
# Constat du 2026-08-12 : le scan bloquait chaque publication depuis le
# 10/08, sur 23 vulnerabilites dont AUCUNE ne provient du code applicatif
# ni de ses dependances de production (`npm audit --omit=dev` est vert).
#
# Deux origines :
#
#   1. Paquets embarques dans NPM lui-meme (tar, brace-expansion,
#      picomatch, ip-address, sigstore). Ils viennent de l'image de base
#      node:25-alpine. On ne peut pas les retirer : docker-entrypoint.sh
#      utilise `npx` au demarrage (prisma db push, seed, scripts de
#      migration). Correction possible seulement quand Node publiera une
#      image de base corrigee.
#
#   2. Binaire Go d'ESBUILD (stdlib go1.23.12), tire par `tsx`, lui-meme
#      requis au runtime par l'entrypoint. La montee de version est
#      bloquee par DEUX contraintes simultanees :
#        - notre quarantaine anti-supply-chain (minimum-release-age =
#          7 jours) : les tsx corriges sont trop recents ;
#        - un conflit de resolution : tsx >= 4.23.5 exige esbuild ~0.28,
#          vite (vitest) exige ^0.25, et npm ne nidifie pas les deux.
#
# Nature du risque : ces CVE sont des denis de service (et une validation
# de certificat pour crypto/tls). Aucune n'est atteignable depuis une
# entree utilisateur : esbuild et npm ne traitent que des fichiers locaux
# de confiance, au demarrage du conteneur, jamais du contenu distant.
#
# A FAIRE AVANT EXPIRATION :
#   - re-tester `npm i -D tsx@<derniere version sortie de quarantaine>` et
#     verifier que npm nidifie bien esbuild 0.28 sous tsx ;
#   - verifier si node:25-alpine a ete republiee avec un npm corrige ;
#   - a defaut, ne plus embarquer l'outillage de build dans l'image
#     runtime (le stage `runner` copie aujourd'hui TOUT node_modules).

vulnerabilities:
